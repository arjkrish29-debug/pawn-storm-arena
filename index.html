/* scoring */
function pt(g,id){if(!g.r)return 0;if(g.r==='.5')return .5;if(g.w===id)return g.r==='1-0'?1:0;return g.r==='0-1'?1:0}
function score(e,id){var s=0;e.rd.forEach(function(r){r.forEach(function(g){if(g.w===id||g.b===id)s+=pt(g,id)})});return s}
function standings(e){
 var rows=e.players.map(function(p){var bu=0;e.rd.forEach(function(r){r.forEach(function(g){if(g.b!==null&&(g.w===p.id||g.b===p.id)){bu+=score(e,g.w===p.id?g.b:g.w)}})});return{p:p,pts:score(e,p.id),bu:bu}});
 rows.sort(function(a,b){return b.pts-a.pts||b.bu-a.bu||b.p.rtg-a.p.rtg});return rows}
function roundDone(e){if(!e.rd.length)return true;return e.rd[e.rd.length-1].every(function(g){return g.r})}

/* Swiss pairing */
function pairRound(e){
 var played={},blk={},hadBye={},sc={};
 e.players.forEach(function(p){played[p.id]={};blk[p.id]=0;sc[p.id]=score(e,p.id)});
 e.rd.forEach(function(r){r.forEach(function(g){if(g.b===null){hadBye[g.w]=1}else{played[g.w][g.b]=1;played[g.b][g.w]=1;blk[g.b]++;blk[g.w]--}})});
 var list=e.players.filter(function(p){return!p.wd});
 if(!e.rd.length){list.sort(function(a,b){return b.rtg-a.rtg})}
 else{list.sort(function(a,b){return sc[b.id]-sc[a.id]||b.rtg-a.rtg})}
 var bye=null;
 if(list.length%2){for(var i=list.length-1;i>=0;i--){if(!hadBye[list[i].id]){bye=list.splice(i,1)[0];break}}
  if(!bye)bye=list.pop()}
 var pairs=[];
 if(!e.rd.length){var h=list.length/2;for(var k=0;k<h;k++)pairs.push(k%2?[list[k+h],list[k]]:[list[k],list[k+h]])}
 else{
  var go=function(l,rep){if(!l.length)return[];var a=l[0];
   for(var i=1;i<l.length;i++){var b=l[i];if(!rep&&played[a.id][b.id])continue;
    var m=go(l.filter(function(x,j){return j&&j!==i}),rep);
    if(m){var d=blk[a.id]-blk[b.id];var bd=m.length;
     var wb=d>0?[a,b]:d<0?[b,a]:(bd%2?[a,b]:[b,a]);return[wb].concat(m)}}
   return null};
  pairs=go(list,false)||go(list,true)||[]}
 var rd=pairs.map(function(p){return{w:p[0].id,b:p[1].id,r:''}});
 if(bye)rd.push({w:bye.id,b:null,r:'1-0'});
 e.rd.push(rd)}

function addForm(e){return'<form id="addp" class="row"><label>Name<input name="n" required autocomplete="off"></label><label>Rating<input name="r" type="number" min="0" max="3000" value="0" style="width:6rem"></label><label>School or club<input name="s" autocomplete="off"></label><label>Email<input name="m" type="email" autocomplete="off"></label><button class="btn" type="submit"'+(e.rd.length?' disabled':'')+'>Add player</button>'+(e.players.length?'':'<button class="btn ghost" type="button" data-sample="1">Add 8 sample players</button>')+'</form>'}
function plRows(e){
 var q=tdQ.toLowerCase(),L=e.players.filter(function(p){
  if(tdF==='wd'){if(!p.wd)return false}else if(p.wd)return false;
  if(tdF==='ci'&&p.ci)return false;
  if(tdF==='pay'&&p.paid)return false;
  if(tdF==='prob'&&p.email&&p.school)return false;
  if(q&&(p.name+' '+(p.school||'')+' '+(p.email||'')).toLowerCase().indexOf(q)<0)return false;
  return true});
 if(!L.length)return'<div class="empty">No players here.</div>';
 return'<div class="tw"><table><tr><th>Name</th><th>Rating</th><th>Section</th><th>School</th><th>Email</th><th>Status</th><th></th></tr>'+L.map(function(p){
  return'<tr><td>'+esc(p.name)+'</td><td>'+(p.rtg||'unr')+'</td><td>'+esc(p.section||'')+'</td><td>'+esc(p.school||'')+'</td><td>'+esc(p.email||'')+'</td><td>'+(p.ci?'<span class="chip ok">Checked in</span> ':'')+(p.paid?'<span class="chip ok">Paid</span>':'<span class="chip warn">Unpaid</span>')+'</td><td>'+(p.wd?'<button class="btn ghost sm" data-wd="'+p.id+'">Restore</button>':'<button class="btn ghost sm" data-ci="'+p.id+'">'+(p.ci?'Undo check-in':'Check in')+'</button> <button class="btn ghost sm" data-paid="'+p.id+'">'+(p.paid?'Mark unpaid':'Mark paid')+'</button> <button class="btn ghost sm" data-wd="'+p.id+'">Withdraw</button>')+(e.rd.length?'':' <button class="btn ghost sm" data-del="'+p.id+'">Remove</button>')+'</td></tr>'}).join('')+'</table></div>'}
function tdPlayers(e){
 var c=tdCounts(e),h='<h1 class="tdh">Players</h1><div class="tbar">'+[['players','Players'],['entry','Entry list'],['teams','Teams']].map(function(t){return'<button class="tb'+(tdTab===t[0]?' on':'')+'" data-tdtab="'+t[0]+'">'+t[1]+'</button>'}).join('')+'<a class="tb" href="#e-'+e.id+'">Register players &#8599;</a></div>';
 if(tdTab==='entry'){var g={};c.act.slice().sort(function(a,b){return b.rtg-a.rtg}).forEach(function(p){var k=p.section||'All players';(g[k]=g[k]||[]).push(p)});
  var ks=Object.keys(g);if(!ks.length)return h+'<div class="empty">No players here.</div>';
  return h+ks.map(function(k){return'<h3>'+esc(k)+' ('+g[k].length+')</h3><ol>'+g[k].map(function(p){return'<li>'+esc(p.name)+' ('+(p.rtg||'unr')+')'+(p.school?', '+esc(p.school):'')+'</li>'}).join('')+'</ol>'}).join('')}
 if(tdTab==='teams'){var t={};c.act.forEach(function(p){var k=p.school||'No school or club';(t[k]=t[k]||[]).push(p)});
  var tk=Object.keys(t);if(!tk.length)return h+'<div class="empty">No teams yet.</div>';
  return h+'<div class="tw"><table><tr><th>School or club</th><th>Players</th><th>Names</th><th>Contact</th></tr>'+tk.map(function(k){var ps=t[k],ct=ps.find(function(p){return p.email||p.parent});return'<tr><td>'+esc(k)+'</td><td>'+ps.length+'</td><td style="white-space:normal">'+ps.map(function(p){return esc(p.name)}).join(', ')+'</td><td>'+(ct?esc((ct.parent||'')+' '+(ct.email||'')):'')+'</td></tr>'}).join('')+'</table></div>'}
 h+='<div class="toprow"><div class="pills">'+[['all','Everyone'],['ci','Check-in'],['pay','Payments'],['prob','Problems'],['wd','Withdrawn']].map(function(f){return'<button class="pill'+(tdF===f[0]?' on':'')+'" data-tdf="'+f[0]+'">'+f[1]+' '+c[f[0]]+'</button>'}).join('')+'</div><button class="btn" data-tdadd="1">'+(tdAdd?'Close':'Add a player')+'</button></div>';
 if(tdAdd){h+='<div class="panel"><div class="tbar"><button class="tb'+(tdAddTab==='player'?' on':'')+'" data-addtab="player">Add a player</button><button class="tb'+(tdAddTab==='team'?' on':'')+'" data-addtab="team">Add a team</button></div>'+(tdAddTab==='team'?teamAdmin(e):addForm(e))+'</div>'}
 return h+'<input id="tdsearch" type="search" placeholder="Name, school or email" aria-label="Search players" value="'+esc(tdQ)+'" style="width:100%;max-width:420px;margin:.5rem 0 1rem"><div id="plist">'+plRows(e)+'</div>'}
function vManage(){
 var e=cur(),c=tdCounts(e),n=e.rd.length,done=roundDone(e),h='';
 var side=function(a){return a.map(function(i){return'<button class="si'+(tdView===i[0]?' on':'')+'" data-tdv="'+i[0]+'">'+i[1]+'</button>'}).join('')};
 h+='<div class="tdwrap"><aside class="side"><a href="#e-'+e.id+'" class="muted sm">&larr; Event page</a><b>'+esc(e.name)+'</b><span class="muted sm">'+tdStatus(e)+'</span><select id="sel" aria-label="Tournament">'+S.ev.map(function(x){return'<option value="'+x.id+'"'+(x.id===e.id?' selected':'')+'>'+esc(x.name)+'</option>'}).join('')+'</select><div class="sh">RUN THE EVENT</div>'+side([['today','Today'],['players','Players'],['rounds','Rounds'],['standings','Standings']])+'<div class="sh">OFFICE</div>'+side([['money','Money'],['setup','Setup'],['finish','Finish &amp; rate']])+'</aside><section>';
 if(!(ref&&canWrite))h+='<div class="panel"><b>Not shared.</b> Changes here are saved in this browser only.</div>';
 if(tdView==='players')h+=tdPlayers(e);
 else if(tdView==='rounds'){
  var can=c.all>=2&&n<e.rounds&&done;
  h+='<h1 class="tdh">Rounds</h1><div class="panel row"><span>'+(n?'Round '+n+' of '+e.rounds:'No rounds yet')+'</span><button class="btn" data-gen="1"'+(can?'':' disabled')+'>Pair round '+(n+1)+'</button>';
  if(n&&!done)h+='<span class="muted">Enter every result to pair the next round.</span>';
  if(n&&!e.rd[n-1].some(function(g){return g.r&&g.b!==null}))h+='<button class="btn ghost" data-undo="1">Undo round '+n+'</button>';
  h+='</div>';
  for(var ri=n-1;ri>=0;ri--){
   h+='<h3>Round '+(ri+1)+'</h3><div class="tw"><table><tr><th>Bd</th><th>White</th><th>Black</th><th>Result</th></tr>';
   e.rd[ri].forEach(function(g,gi){
    h+='<tr><td>'+(g.b===null?'-':gi+1)+'</td><td>'+esc(pname(e,g.w))+'</td><td>'+(g.b===null?'<span class="muted">Bye</span>':esc(pname(e,g.b)))+'</td><td>';
    if(g.b===null)h+='1 point';
    else h+='<select data-ri="'+ri+'" data-gi="'+gi+'" aria-label="Result board '+(gi+1)+'"><option value="">Pending</option><option value="1-0"'+(g.r==='1-0'?' selected':'')+'>1-0</option><option value=".5"'+(g.r==='.5'?' selected':'')+'>½-½</option><option value="0-1"'+(g.r==='0-1'?' selected':'')+'>0-1</option></select>';
    h+='</td></tr>'});
   h+='</table></div>'}}
 else if(tdView==='standings'){
  h+='<h1 class="tdh">Standings</h1>'+(e.players.length?'<div class="tw"><table><tr><th>#</th><th>Player</th><th>Rating</th><th>Points</th><th>Tiebreak</th></tr>'+standings(e).map(function(r,i){return'<tr><td>'+(i+1)+'</td><td>'+esc(r.p.name)+'</td><td>'+(r.p.rtg||'unr')+'</td><td>'+r.pts+'</td><td>'+r.bu+'</td></tr>'}).join('')+'</table></div><p><button class="btn ghost" data-copy="1">Copy results</button></p>':'<div class="empty">No players here.</div>')}
 else if(tdView==='money'){
  var unpaid=c.act.filter(function(p){return!p.paid});
  h+='<h1 class="tdh">Money</h1><div class="cards"><div class="panel"><b>'+(c.all-c.pay)+'</b><br>paid</div><div class="panel"><b>'+c.pay+'</b><br>unpaid</div></div>';
  if(e.fees&&e.fees.length)h+='<h3>Entry fees</h3><div class="tw"><table>'+e.fees.map(function(f){return'<tr><th>'+esc(f[0])+'</th><td>'+esc(f[1])+'</td></tr>'}).join('')+'</table></div>';
  h+='<h3>Unpaid players</h3>'+(unpaid.length?'<div class="tw"><table>'+unpaid.map(function(p){return'<tr><td>'+esc(p.name)+'</td><td>'+esc(p.school||'')+'</td><td><button class="btn ghost sm" data-paid="'+p.id+'">Mark paid</button></td></tr>'}).join('')+'</table></div>':'<div class="empty">Everyone has paid.</div>')}
 else if(tdView==='setup'){
  h+='<h1 class="tdh">Setup</h1><div class="panel row"><label>Tournament director<input id="tdname" value="'+esc(S.td)+'"></label>'+(S.ev.length>1?'<button class="btn ghost" data-delev="1">Delete this tournament</button>':'')+'</div>'+coachAdmin()+'<h2>Create a tournament</h2><form id="newev" class="panel row"><label>Name<input name="n" required></label><label>Date<input name="d" type="date" required></label><label>Location<input name="v" required></label><label>Street address<input name="a"></label><label>Rounds<input name="k" type="number" min="1" max="9" value="4" style="width:5rem"></label><button class="btn" type="submit">Create</button></form>'}
 else if(tdView==='finish'){
  h+='<h1 class="tdh">Finish &amp; rate</h1><div class="panel"><p><b>'+tdStatus(e)+'</b></p><p class="muted">'+n+' of '+e.rounds+' rounds paired, '+c.all+' players.</p><button class="btn" data-copy="1">Copy final results</button><p class="muted sm">Rating report files are not available yet.</p></div>'}
 else{
  var next=!c.all?['Add players to get started','players']:(n&&!done?['Enter the results for round '+n,'rounds']:(n<e.rounds?['Pair round '+(n+1),'rounds']:['All rounds are complete. Finish the event.','finish']));
  h+='<h1 class="tdh">Today</h1><p class="muted">'+fmt(e.date)+', '+esc(e.venue)+'</p><div class="cards"><div class="panel"><b>'+c.all+'</b><br>players</div><div class="panel"><b>'+c.ci+'</b><br>not checked in</div><div class="panel"><b>'+c.pay+'</b><br>unpaid</div><div class="panel"><b>'+(n?'Round '+n:'Draft')+'</b><br>of '+e.rounds+'</div></div><div class="panel row"><span><b>Next step:</b> '+next[0]+'</span><button class="btn" data-tdv="'+next[1]+'">Go</button></div>'}
 return h+'</section></div>'}

function render(){
 applyTheme();var m=location.hash==='#manage';
 var lg=location.hash==='#login',hp=location.hash==='#help',td=isTD();$('#nav').innerHTML='<a href="#events" class="'+(m||lg||hp?'':'on')+'">Tournaments</a>'+(td?'<a href="#manage" class="'+(m?'on':'')+'">TD console</a>':'')+(S.user?'<button class="lk" data-logout="1">Log out</button>':'<a href="#login" class="'+(lg?'on':'')+'">Log in</a>')+(S.user?bellHtml():'')+'<a href="https://www.uschess.org" target="_blank" rel="noopener">US Chess Membership</a><button class="lk" data-lang="en">EN</button><button class="lk" data-lang="es">ES</button>';
 var d=/^#e-/.test(location.hash)?ev(location.hash.slice(3)):null;$('#app').innerHTML=m?(td?vManage():vLocked()):({'#help':vHelp,'#pairings-guide':vGuide,'#coaches':vCoaches,'#privacy':vPrivacy,'#terms':vTerms,'#sms':vSms}[location.hash]||function(){return lg?vLogin():d?vDetail(d):vEvents()})();tr()}

/* events */
var regId=null,done=null,armed=false;
function addPlayer(e,n,r){e.players.push({id:uid(),name:n.trim(),rtg:Math.max(0,parseInt(r,10)||0)})}
document.addEventListener('click',function(x){
 var t=x.target.closest('button');if(!t)return;var e=cur();
 if(t.dataset.reg){var ee=ev(t.dataset.reg);if(ee.rd.length){toast('Registration is closed. Pairings have started.');return}regId=ee.id;$('#regt').textContent='Register for '+ee.name;$('#reg').showModal();return}
 if(t.dataset.tdv){tdView=t.dataset.tdv;tdAdd=false;render();window.scrollTo(0,0);return}
 if(t.dataset.tdf){tdF=t.dataset.tdf;render();return}
 if(t.dataset.tdtab){tdTab=t.dataset.tdtab;render();return}
 if(t.dataset.tdadd){tdAdd=!tdAdd;render();return}
 if(t.dataset.addtab){tdAddTab=t.dataset.addtab;render();return}
if(t.dataset.ci||t.dataset.paid||t.dataset.wd){var pid=t.dataset.ci||t.dataset.paid||t.dataset.wd,pp=e.players.find(function(z){return z.id===pid}),pk=t.dataset.ci?'ci':t.dataset.paid?'paid':'wd';if(pp){pp[pk]=!pp[pk];save();render()}return}
if(t.dataset.copy){var tx=standings(e).map(function(r,i){return(i+1)+'. '+r.p.name+' '+r.pts}).join('\n');try{navigator.clipboard.writeText(tx).then(function(){toast('Results copied')},function(){toast('Could not copy')})}catch(er){toast('Could not copy')}return}
 if(t.dataset.theme){S.theme=themeEff()==='dark'?'light':'dark';try{localStorage.setItem('dkc-platform',JSON.stringify(S))}catch(er){}render();return}
 if(t.dataset.delcoach){S.coaches.splice(+t.dataset.delcoach,1);save();render();return}
 if(t.dataset.lang){S.lang=t.dataset.lang;try{localStorage.setItem('dkc-platform',JSON.stringify(S))}catch(er){}render();return}
 if(t.dataset.showteam){var tb=$('#teambox');if(tb){tb.hidden=false;tb.scrollIntoView({behavior:'smooth',block:'center'});var ti=tb.querySelector('input');if(ti)ti.focus({preventScroll:true})}return}
 if(t.dataset.hideteam){$('#teambox').hidden=true;return}
 if(t.dataset.find){var uh=$('#upc');if(uh)uh.scrollIntoView({behavior:'smooth'});return}
 if(t.dataset.jump){var jh=[].slice.call(document.querySelectorAll('#app h2')).filter(function(h){return /^(Round|Players|Pairings)/.test(h.textContent)})[0];if(jh)jh.scrollIntoView({behavior:'smooth'});return}
 if(t.dataset.share){try{navigator.clipboard.writeText(location.href).then(function(){toast('Link copied')},function(){toast('Copy the link from your address bar to share')})}catch(er){toast('Copy the link from your address bar to share')}return}
 if(t.dataset.delev){if(!armed){armed=true;toast('Click again to delete "'+e.name+'" and its players.');setTimeout(function(){armed=false},4000);return}armed=false;S.ev=S.ev.filter(function(z){return z.id!==e.id});S.cur=S.ev[0].id;save();render();toast('Tournament deleted');return}
 if(t.dataset.resetpw){S.pw=null;save();render();toast('Password cleared. Enter a new password (8 or more characters) to set it.');return}
 if(t.dataset.bell){bellOpen=!bellOpen;if(bellOpen){S.seen=notes().map(function(n){return n.k});try{localStorage.setItem('dkc-platform',JSON.stringify(S))}catch(er){}}render();return}
 if(t.dataset.logout){bellOpen=false;S.user=null;save();location.hash='#events';render();toast('Logged out');return}
 if(t.dataset.showreg){var bx=$('#regbox');if(bx){bx.hidden=false;bx.scrollIntoView({behavior:'smooth',block:'center'});var fi=bx.querySelector('input');if(fi)fi.focus({preventScroll:true})}return}
 if(t.dataset.hidereg){$('#regbox').hidden=true;return}
 if(t.dataset.mng){S.cur=t.dataset.mng;save();location.hash='#manage';render();return}
 if(t.dataset.sample){['Enroquero, S.|1971','Fianchetti, M.|1864','Alfilar, A.|2117','Tablerino, J.|1830','Peonez, R.|1420','Torres, L.|1305','Gambito, D.|1150','Casilla, E.|0'].forEach(function(s){var a=s.split('|');addPlayer(e,a[0],a[1])});save();render();return}
 if(t.dataset.del){e.players=e.players.filter(function(p){return p.id!==t.dataset.del});save();render();return}
 if(t.dataset.gen){pairRound(e);save();render();toast('Round '+e.rd.length+' paired');return}
 if(t.dataset.undo){e.rd.pop();save();render();return}
 if(t.id==='regx'){$('#reg').close()}});
document.addEventListener('change',function(x){
 var t=x.target;
 if(t.id==='sel'){S.cur=t.value;save();render()}
 else if(t.id==='tdname'){S.td=t.value||'Tournament Director';save()}
 else if(t.id==='formurl'){var u=t.value.trim();if(u&&!/^https?:\/\//.test(u)){toast('The link must start with https://');t.value='';u=''}cur().form=u;save();toast(u?'Registration link saved':'Registration link cleared')}
 else if(t.dataset&&t.dataset.ri!==undefined){cur().rd[+t.dataset.ri][+t.dataset.gi].r=t.value;save();render()}});
document.addEventListener('submit',function(x){
 var f=x.target;
 if(f.id==='regf'){x.preventDefault();var e=ev(regId);addPlayer(e,f.n.value,f.r.value);save();f.reset();$('#reg').close();toast('Registered. '+e.players.length+' players now in this event.');render()}
 else if(f.id==='loginf'){x.preventDefault();var em=f.e.value.trim().toLowerCase(),pw=f.p.value;if(em!==TD){S.user=em;save();location.hash='#events';render();toast('Logged in');return}if(!S.pw){if(pw.length<8){toast('Choose a password with at least 8 characters.');return}hashPw(pw).then(function(h){S.pw=h;S.user=em;save();location.hash='#manage';render()})}else{hashPw(pw).then(function(h){if(h===S.pw){S.user=em;save();location.hash='#manage';render()}else{toast('Wrong password.')}})}}
 else if(f.id==='addcoach'){x.preventDefault();S.coaches=S.coaches||[];S.coaches.push({name:f.n.value.trim(),school:f.s.value.trim(),email:f.m.value.trim(),phone:f.t.value.trim()});save();render();toast('Coach added')}
 else if(f.id==='tdteam'){x.preventDefault();var e3=cur(),rs=f.p.value.split('\n').map(function(l){return l.trim()}).filter(Boolean),added=0,skipped=0;
 rs.forEach(function(l){var a=l.split(',').map(function(z){return z.trim()});if(!a[0])return;if(e3.players.some(function(p){return p.name.toLowerCase()===a[0].toLowerCase()})){skipped++;return}e3.players.push({id:uid(),name:a[0],rtg:Math.max(0,parseInt(a[1],10)||0),grade:a[2]||'',section:a[3]||'',school:f.s.value.trim(),parent:f.c.value.trim(),email:f.m.value.trim(),phone:f.t.value.trim()});added++});
 save();render();toast(added+' players added'+(skipped?', '+skipped+' skipped (already on the roster)':''))}

 if(ref&&canWrite){rows.forEach(function(l){var a=l.split(',').map(function(z){return z.trim()});if(a[0])et.players.push({id:uid(),name:a[0],rtg:Math.max(0,parseInt(a[1],10)||0),grade:a[2]||'',section:a[3]||'',school:f.s.value.trim(),parent:f.c.value.trim(),email:f.m.value.trim(),phone:f.t.value.trim()})});save();render();toast(rows.length+' players added')}
 else{var tb2=['Team registration: '+et.name,'School or club: '+f.s.value,'Coach: '+f.c.value,'Email: '+f.m.value,'Phone: '+f.t.value,'','Players (name, rating, grade, section):'].concat(rows).join('\n');mailto='mailto:'+TD+'?subject='+encodeURIComponent('Team registration: '+et.name)+'&body='+encodeURIComponent(tb2);done=null;render();window.scrollTo(0,0)}}
 else if(f.id==='regf2'){x.preventDefault();var e2=ev(f.dataset.ev);if(e2.rd.length){toast('Registration is closed.');return}var nm=f.n.value.trim();if(!(ref&&canWrite)){var bd=['Player: '+nm,'Rating: '+f.r.value,'Grade: '+f.g.value,'School or club: '+f.s.value,'Parent or guardian: '+f.p.value,'Email: '+f.m.value,'Phone: '+f.t.value,'Section: '+(f.sec?f.sec.value:'')].join('\n');mailto='mailto:'+TD+'?subject='+encodeURIComponent('Registration: '+e2.name)+'&body='+encodeURIComponent(bd);done=null;render();window.scrollTo(0,0);return}if(e2.players.some(function(p){return p.name.toLowerCase()===nm.toLowerCase()})){toast('That player is already registered.');return}e2.players.push({id:uid(),name:nm,rtg:Math.max(0,parseInt(f.r.value,10)||0),grade:f.g.value.trim(),school:f.s.value.trim(),parent:f.p.value.trim(),email:f.m.value.trim(),phone:f.t.value.trim()});save();done=nm;render();window.scrollTo(0,0)}
 else if(f.id==='addp'){x.preventDefault();addPlayer(cur(),f.n.value,f.r.value);var lp=cur().players[cur().players.length-1];lp.school=f.s.value.trim();lp.email=f.m.value.trim();save();render()}
 else if(f.id==='newev'){x.preventDefault();var id=uid();S.ev.push({id:id,name:f.n.value.trim(),date:f.d.value,venue:f.v.value.trim(),address:f.a.value.trim(),rounds:Math.min(9,Math.max(1,+f.k.value||4)),players:[],rd:[]});S.cur=id;save();render();toast('Tournament created')}});
document.addEventListener('input',function(x){if(x.target.id==='tdsearch'){tdQ=x.target.value;var pl=$('#plist');if(pl)pl.innerHTML=plRows(cur())}});
window.addEventListener('hashchange',function(){bellOpen=false;done=null;mailto=null;render();window.scrollTo(0,0)});
syncDb();
render();
})();
